# IrisTaxFiling landing page on Cloudflare: static assets behind a small Worker (src/index.js) that logs page views
# and serves the password-protected /visitors table. Secret: VISITORS_PASSWORD (wrangler secret put VISITORS_PASSWORD).
# Deploy: npx wrangler deploy
# The early-access form and its /register Worker were removed: visitors now go straight to the app
# (app.iristaxfiling.com) to try one file free or create an account.
name = "iristaxfiling-site"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Visitor log storage (SQLite-backed Durable Object).
[[durable_objects.bindings]]
name = "VISITOR_LOG"
class_name = "VisitorLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitorLog"]

[[routes]]
pattern = "iristaxfiling.com"
custom_domain = true

[[routes]]
pattern = "www.iristaxfiling.com"
custom_domain = true
