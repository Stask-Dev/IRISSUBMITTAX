# IrisTaxFiling landing page on Cloudflare: static assets plus a small Worker for the registration form (/register).
# Deploy: npx wrangler deploy
# Secret (not in this repo): NOTIFY_TO, the address that receives registrations. Set it with `wrangler secret put NOTIFY_TO`.
name = "iristaxfiling-site"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "."
binding = "ASSETS"
# Only /register runs the script; everything else is served straight from the static files.
run_worker_first = ["/register"]

[[kv_namespaces]]
binding = "REGISTRATIONS"
id = "dbb02de0169247dda836534bd5f2e9b4"

[[send_email]]
name = "MAILER"

[[routes]]
pattern = "iristaxfiling.com"
custom_domain = true

[[routes]]
pattern = "www.iristaxfiling.com"
custom_domain = true
